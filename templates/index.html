<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbox</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --panel-2: #1c2128;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #6e8aff;
            --accent-2: #9d6eff;
            --user-bubble: #2b4a8b;
            --bot-bubble: #1c2128;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .brand { display: flex; align-items: center; gap: 12px; }

        .avatar {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: white;
        }

        .brand h1 { font-size: 17px; font-weight: 600; }
        .brand .sub { font-size: 12px; color: var(--muted); }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #3fb950; display: inline-block; margin-right: 6px;
            box-shadow: 0 0 6px #3fb95088;
        }
        .status-dot.off { background: #f85149; box-shadow: none; }

        #resetBtn {
            background: var(--panel-2);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        #resetBtn:hover { color: var(--text); border-color: var(--accent); }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .msg { display: flex; gap: 10px; max-width: 82%; animation: fadeUp 0.2s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 600;
        }
        .msg.bot .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
        .msg.user .msg-avatar { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

        .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-radius: 14px;
            border-top-left-radius: 4px;
            padding: 11px 15px;
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble {
            background: var(--user-bubble);
            border-color: transparent;
            border-radius: 14px;
            border-top-right-radius: 4px;
        }

        .meta {
            margin-top: 7px;
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .intent-chip {
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10.5px;
        }
        .conf-bar {
            width: 52px; height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .conf-fill { height: 100%; background: var(--accent); }

        .bubble.streaming::after {
            content: '▋';
            color: var(--accent);
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .typing { display: flex; gap: 5px; padding: 6px 2px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

        #suggestions {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding: 0 18px 10px;
            max-width: 860px; width: 100%; margin: 0 auto;
        }
        .chip {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .chip:hover { color: var(--text); border-color: var(--accent); }

        #inputBar {
            padding: 14px 18px 18px;
            background: var(--bg);
        }
        .input-wrap {
            display: flex; gap: 10px;
            max-width: 860px; margin: 0 auto;
        }
        #input {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text);
            font-size: 14.5px;
            outline: none;
            transition: border-color 0.15s;
        }
        #input:focus { border-color: var(--accent); }
        #input::placeholder { color: var(--muted); }

        #sendBtn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none;
            border-radius: 12px;
            color: white;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        #sendBtn:hover:not(:disabled) { opacity: 0.9; }
        #sendBtn:active:not(:disabled) { transform: scale(0.97); }
        #sendBtn:disabled { opacity: 0.4; cursor: default; }

        #chat::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        @media (max-width: 600px) {
            .msg { max-width: 92%; }
            .brand .sub { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="avatar" id="botAvatar">A</div>
            <div>
                <h1 id="botName">AI Chatbox</h1>
                <div class="sub">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">connecting…</span>
                </div>
            </div>
        </div>
        <button id="resetBtn">Reset chat</button>
    </header>

    <div id="chat">
        <div class="msg bot">
            <div class="msg-avatar">A</div>
            <div class="bubble">Hey! I'm your AI chatbox — part intent classifier, part transformer. Ask me anything, or try a suggestion below.</div>
        </div>
    </div>

    <div id="suggestions"></div>

    <div id="inputBar">
        <div class="input-wrap">
            <input id="input" type="text" placeholder="Type a message…" autocomplete="off" maxlength="2000">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const resetBtn = document.getElementById('resetBtn');
        const userId = 'web_' + Math.random().toString(36).slice(2, 10);
        let botInitial = 'A';

        const SUGGESTIONS = [
            'lets talk about movies',
            'tell me a joke',
            'what is 12 * 8',
            "i'm bored",
            'give me a riddle',
            'help me learn python',
        ];

        function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

        function makeMsg(role, text) {
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;
            const av = document.createElement('div');
            av.className = 'msg-avatar';
            av.textContent = role === 'bot' ? botInitial : 'U';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (text !== undefined) bubble.textContent = text;
            msg.appendChild(av); msg.appendChild(bubble);
            chat.appendChild(msg);
            scrollBottom();
            return bubble;
        }

        function attachMeta(bubble, data) {
            const meta = document.createElement('div');
            meta.className = 'meta';
            const chip = document.createElement('span');
            chip.className = 'intent-chip';
            chip.textContent = data.intent;
            const bar = document.createElement('div');
            bar.className = 'conf-bar';
            const fill = document.createElement('div');
            fill.className = 'conf-fill';
            fill.style.width = `${Math.round(data.confidence * 100)}%`;
            bar.appendChild(fill);
            const pct = document.createElement('span');
            pct.textContent = `${Math.round(data.confidence * 100)}%`;
            meta.appendChild(chip); meta.appendChild(bar); meta.appendChild(pct);
            bubble.appendChild(meta);
        }

        let typingEl = null;
        function showTyping() {
            if (typingEl) return;
            const msg = document.createElement('div');
            msg.className = 'msg bot';
            const av = document.createElement('div');
            av.className = 'msg-avatar'; av.textContent = botInitial;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            msg.appendChild(av); msg.appendChild(bubble);
            chat.appendChild(msg); scrollBottom();
            typingEl = msg;
        }
        function hideTyping() { typingEl?.remove(); typingEl = null; }

        function setBusy(b) { sendBtn.disabled = b; input.disabled = b; if (!b) input.focus(); }

        function send(text) {
            const message = (text ?? input.value).trim();
            if (!message) return;
            makeMsg('user', message);
            input.value = '';
            setBusy(true);
            showTyping();

            const params = new URLSearchParams({ message, user_id: userId });
            const es = new EventSource(`/chat/stream?${params}`);
            let bubble = null, streamed = '';

            const finish = () => {
                es.close();
                bubble?.classList.remove('streaming');
                setBusy(false);
            };

            es.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.error) {
                    hideTyping();
                    makeMsg('bot', `Error: ${data.error}`);
                    finish(); return;
                }
                if (data.token !== undefined) {
                    hideTyping();
                    if (!bubble) { bubble = makeMsg('bot'); bubble.classList.add('streaming'); }
                    streamed += data.token;
                    bubble.textContent = streamed;
                    scrollBottom();
                }
                if (data.done) {
                    hideTyping();
                    if (bubble) {
                        bubble.textContent = data.response;
                        attachMeta(bubble, data);
                    } else {
                        const b = makeMsg('bot', data.response);
                        attachMeta(b, data);
                    }
                    finish();
                }
            };
            es.onerror = () => {
                hideTyping();
                if (!bubble) makeMsg('bot', 'Connection error — is the server running?');
                finish();
            };
        }

        sendBtn.addEventListener('click', () => send());
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

        resetBtn.addEventListener('click', async () => {
            await fetch('/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId }),
            });
            chat.innerHTML = '';
            makeMsg('bot', 'Fresh start — memory of this conversation cleared. What\'s up?');
        });

        // boot: fetch bot status + render suggestion chips
        fetch('/status').then(r => r.json()).then(s => {
            if (s.ready) {
                document.getElementById('botName').textContent = s.ai_name;
                document.getElementById('statusText').textContent =
                    `online · ${s.intents} intents${s.generative ? ' · generative' : ''}`;
                document.getElementById('botAvatar').textContent = s.ai_name[0].toUpperCase();
                botInitial = s.ai_name[0].toUpperCase();
            } else {
                document.getElementById('statusText').textContent = 'loading models…';
                document.getElementById('statusDot').classList.add('off');
            }
        }).catch(() => {
            document.getElementById('statusText').textContent = 'offline';
            document.getElementById('statusDot').classList.add('off');
        });

        const sug = document.getElementById('suggestions');
        for (const s of SUGGESTIONS) {
            const c = document.createElement('button');
            c.className = 'chip';
            c.textContent = s;
            c.onclick = () => send(s);
            sug.appendChild(c);
        }

        input.focus();
    </script>
</body>
</html>
